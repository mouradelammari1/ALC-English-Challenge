 for(const s of bank.sections){id(s);if(!expected[s.id]) fail('Unknown section.');const levels=array(s,'levels');if(JSON.stringify(levels.map(l=>l.id).sort())!==JSON.stringify([...expected[s.id]].sort())) fail('Keep the required levels.');for(const l of levels){id(l);for(const u of array(l,'units')){id(u);for(const lesson of array(u,'lessons')){id(lesson);for(const q of array(lesson,'quizzes')){id(q);if(!categories[q.category]) fail('Choose a valid quiz category.');if(!array(q,'questions').length) fail('A quiz needs at least one question.');for(const item of q.questions){id(item);if(typeof item.prompt!=='string'||!item.prompt.trim()||typeof item.explanation!=='string'||!item.explanation.trim()) fail('Questions need a prompt and explanation.');if(item.type==='choice'){if(!Array.isArray(item.options)||item.options.length<2||!item.options.every(o=>typeof o==='string'&&o.trim())||!Number.isInteger(item.answer)||item.answer<0||item.answer>=item.options.length) fail('Choice questions need options and a valid zero-based answer index.');}else if(item.type==='text'){if(!Array.isArray(item.answers)||!item.answers.length||!item.answers.every(a=>typeof a==='string'&&a.trim())) fail('Text questions need accepted answers.');}else fail('Supported types: choice and text.');}}}}}}
 return bank;
}
function isCorrect(q, answer){return q.type==='choice' ? q.answer===answer : q.answers.some(a=>a.trim().toLocaleLowerCase()===String(answer).trim().toLocaleLowerCase());}
function score(answers){return answers.length?Math.round(answers.filter(Boolean).length/answers.length*100):0;}

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='alc-english-challenge:v1:', read=(k,f)=>{try{return JSON.parse(localStorage.getItem(key+k))??f;}catch{return f;}}, save=(k,v)=>{try{localStorage.setItem(key+k,JSON.stringify(v));return true;}catch{alert('Browser storage is unavailable. Export your content to keep it.');return false;}};
let bank, published, run=null, progress=read('progress',{});const main=$('#main');
const href=(...parts)=>'#/'+parts.map(encodeURIComponent).join('/');
const link=(url,label,cls='')=>`<a class="${cls}" href="${url}">${esc(label)}</a>`;
const icons={children:'✦',juniors:'↗',adults:'◈'};
function crumbs(items){return `<nav class="crumbs" aria-label="Breadcrumb">${[link('#/','Home'),...items.map(([label,url])=>url?link(url,label):`<span aria-current="page">${esc(label)}</span>`)].join('<b>/</b>')}</nav>`;}
function empty(title,body){return `<div class="empty"><span class="empty-icon">▤</span><h3>${esc(title)}</h3><p>${esc(body)}</p><span class="status">Curriculum coming soon</span></div>`;}
function intro(kicker,title,desc){return `<div class="page-intro"><span class="eyebrow">${esc(kicker)}</span><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>`;}
function home(){main.innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow"><i></i> YOUR ENGLISH JOURNEY STARTS HERE</span><h1>A little practice.<br>A world of <em>possibility.</em></h1><p>A space to explore, practice, and grow.<br>Choose your learning space and make English your own.</p><a class="primary" href="#spaces">Find your learning space <span>↗</span></a><div class="hero-note"><span>✦</span> Every learner has a place here.</div></div><div class="hero-art" aria-hidden="true"><div class="art-orbit"></div><div class="art-grid"></div><span class="art-star">✳</span><div class="speech speech-one">Hello<span>there!</span><i>✦</i></div><div class="speech speech-two">A<span>a</span></div><div class="art-label">GROW YOUR CONFIDENCE ↗</div><div class="art-book"><div></div><div></div></div><span class="art-spark">✧</span><div class="art-dot"></div></div></section><section id="spaces" class="spaces"><div class="section-heading"><div><span class="eyebrow">THREE SPACES. ENDLESS POSSIBILITIES.</span><h2>Where will you begin?</h2></div><p>Different stages. One shared love of learning.</p></div><div class="space-grid">${bank.sections.map((s,i)=>`<a class="space-card ${s.id}" href="${href(s.id)}"><div class="card-top"><span class="space-icon">${icons[s.id]}</span><span class="card-number">0${i+1}</span></div><span class="eyebrow">${esc(s.tagline)}</span><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p><div class="card-bottom"><span>${s.levels.length} levels to explore</span><span class="round-arrow">↗</span></div></a>`).join('')}</div></section><section class="path-strip"><div class="strip-icon">◎</div><div><h3>Your journey, one step at a time.</h3><p>Choose a level. Explore a lesson. Put your English into practice.</p></div><div class="path-steps"><span>Explore</span><i>→</i><span>Practice</span><i>→</i><span>Grow</span></div></section><div class="content-note"><span>◷</span><p>Good things are taking shape. Lessons and challenges will appear as your teachers add your course content.</p></div>`;}
function render(){run=null;const parts=location.hash.slice(2).split('/').filter(Boolean).map(x=>{try{return decodeURIComponent(x);}catch{return '';}});document.body.dataset.space=parts[0]||'home';if(!parts.length){home();return;}if(parts[0]==='progress'){const rows=Object.entries(progress);main.innerHTML=crumbs([['My progress']])+intro('YOUR LEARNING JOURNEY','Every step counts.','Your completed quizzes are saved on this browser and device.')+(rows.length?`<div class="level-grid">${rows.map(([id,p])=>`<div class="level-card"><h3>${esc(p.title)}</h3><p>Best score: ${p.best}% · ${p.attempts} attempt(s)</p><progress value="${p.best}" max="100"></progress>${link(p.route,'Practice again →')}</div>`).join('')}</div><button id="clear-progress" class="secondary">Clear my progress</button>`:empty('Your journey is ready','Completed quizzes and your best scores will appear here.'));$('#clear-progress')?.addEventListener('click',()=>{if(confirm('Clear all ALC progress saved in this browser?')){progress={};save('progress',progress);render();}});return;}
const s=bank.sections.find(x=>x.id===parts[0]);if(!s){missing();return;}const c=[[s.title,href(s.id)]];if(parts.length===1){main.innerHTML=crumbs([[s.title]])+intro('YOUR LEARNING SPACE',s.title,s.tagline)+`<div class="level-groups">${[...new Set(s.levels.map(l=>l.group||''))].map(g=>`<section>${g?`<h2>${esc(g)}</h2>`:''}<div class="level-grid">${s.levels.filter(l=>(l.group||'')===g).map(l=>`<a class="level-card" href="${href(s.id,l.id)}"><span class="eyebrow">${l.units.length?`${l.units.length} units`:'Ready for your curriculum'}</span><h3>${esc(l.title)} <span>↗</span></h3><p>${l.units.length?'Explore your units':'Units will appear here when added.'}</p></a>`).join('')}</div></section>`).join('')}</div>`;return;}
const l=s.levels.find(x=>x.id===parts[1]);if(!l){missing();return;}c.push([l.title,href(s.id,l.id)]);if(parts.length===2){main.innerHTML=crumbs(c.map((x,i)=>i===1?[x[0]]:x))+intro(s.title,l.title,'Your course, organized into manageable steps.')+(l.units.length?`<div class="level-grid">${l.units.map(u=>`<a class="level-card" href="${href(s.id,l.id,u.id)}"><span class="eyebrow">${u.lessons.length} lessons</span><h3>${esc(u.title)} ↗</h3></a>`).join('')}</div>`:empty('A fresh start awaits','Your teacher will add units based on your textbook and learning objectives.'))+`<h2 class="practice-title">A place for every kind of practice</h2><div class="practice-grid">${Object.values(categories).map((t,i)=>`<div><span>0${i+1}</span><h3>${t}</h3><small>Available when content is added</small></div>`).join('')}</div>`;return;}
const u=l.units.find(x=>x.id===parts[2]);if(!u){missing();return;}c.push([u.title,href(s.id,l.id,u.id)]);if(parts.length===3){main.innerHTML=crumbs(c.map((x,i)=>i===2?[x[0]]:x))+intro(l.title,u.title,'Choose a lesson to explore its practice activities.')+(u.lessons.length?`<div class="level-grid">${u.lessons.map(v=>link(href(s.id,l.id,u.id,v.id),v.title+' →','level-card')).join('')}</div>`:empty('Lessons are on their way','Your teacher has not added lessons to this unit yet.'));return;}
const lesson=u.lessons.find(x=>x.id===parts[3]);if(!lesson){missing();return;}c.push([lesson.title,href(s.id,l.id,u.id,lesson.id)]);if(parts.length===4){main.innerHTML=crumbs(c.map((x,i)=>i===3?[x[0]]:x))+intro(u.title,lesson.title,'Choose the practice that works for you.')+Object.entries(categories).map(([k,t])=>`<section class="quiz-category"><h2>${t}</h2>${lesson.quizzes.filter(q=>q.category===k).map(q=>`<a class="quiz-link" href="${href(...parts,q.id)}"><span>${esc(q.title)}<small>${q.questions.length} questions${progress[q.id]?` · Best: ${progress[q.id].best}%`:''}</small></span><span>Start →</span></a>`).join('')||'<p class="muted">No activities added yet.</p>'}</section>`).join('');return;}
const quiz=lesson.quizzes.find(x=>x.id===parts[4]);if(!quiz||parts.length!==5){missing();return;}run={quiz,index:0,answers:[],checked:false,route:location.hash,c};showQuestion();}
function missing(){main.innerHTML=crumbs([['Page unavailable']])+empty('This page is not available','The content may have moved or been removed.')+link('#/','Return to learning spaces','primary');}
function showQuestion(){const r=run,q=r.quiz.questions[r.index];main.innerHTML=crumbs([...r.c,[r.quiz.title]])+`<div class="quiz-panel"><span class="eyebrow">${esc(categories[r.quiz.category])}</span><h1>${esc(r.quiz.title)}</h1><div class="question-meta"><span>Question ${r.index+1} of ${r.quiz.questions.length}</span><span>${r.answers.filter(Boolean).length} correct</span></div><progress max="${r.quiz.questions.length}" value="${r.index}"></progress><form id="answer-form"><h2>${esc(q.prompt)}</h2>${q.type==='choice'?`<fieldset><legend class="sr-only">Choose one answer</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" required><span>${esc(o)}</span></label>`).join('')}</fieldset>`:'<label class="text-label">Your answer<input name="answer" autocomplete="off" required maxlength="500"></label>'}<button class="primary" type="submit">Check answer</button></form><div id="feedback" role="status" aria-live="polite"></div></div>`;$('#answer-form').onsubmit=e=>{e.preventDefault();if(r.checked)return;const val=new FormData(e.target).get('answer');if(val===null||!String(val).trim())return;r.checked=true;const correct=isCorrect(q,q.type==='choice'?Number(val):val);r.answers.push(correct);e.target.querySelectorAll('input,button').forEach(x=>x.disabled=true);$('#feedback').innerHTML=`<div class="feedback ${correct?'correct':'incorrect'}"><h3>${correct?'Well done!':'Keep learning.'}</h3><p>${esc(q.explanation)}</p>${correct?'':`<p>Accepted answer: ${esc(q.type==='choice'?q.options[q.answer]:q.answers.join(' / '))}</p>`}</div><button id="next" class="primary">${r.index+1===r.quiz.questions.length?'See my results':'Next question →'}</button>`;$('#next').onclick=()=>{r.index++;r.checked=false;if(r.index<r.quiz.questions.length)showQuestion();else finish();};};}
function finish(){const r=run,result=score(r.answers),old=progress[r.quiz.id];progress[r.quiz.id]={title:r.quiz.title,best:Math.max(old?.best||0,result),last:result,attempts:(old?.attempts||0)+1,route:r.route};save('progress',progress);main.innerHTML=crumbs([...r.c,[r.quiz.title]])+`<div class="results"><span class="eyebrow">PRACTICE COMPLETE</span><div class="result-score">${result}<small>%</small></div><h1>Another step forward.</h1><p>${r.answers.filter(Boolean).length} of ${r.answers.length} correct · Best score: ${progress[r.quiz.id].best}%</p><button class="primary" id="replay">Try again ↻</button> ${link(r.c.at(-1)[1],'Back to lesson','secondary')}<h2>Review your answers</h2>${r.quiz.questions.map((q,i)=>`<div class="answer-review"><strong>${r.answers[i]?'✓':'○'} ${esc(q.prompt)}</strong><p>${esc(q.explanation)}</p></div>`).join('')}</div>`;$('#replay').onclick=render;}
function teacher(){const el=$('#teacher');el.hidden=!el.hidden;if(el.hidden)return;el.innerHTML=`<div class="teacher-head"><div><span class="eyebrow">TEACHER WORKSPACE</span><h2>Shape the next lesson.</h2></div><button id="close-editor" class="secondary">Close ✕</button></div><p>Edits are drafts on this browser. Use Export website to download an updated index.html, then upload it to your separate GitHub repository to publish for students. JSON exports are backups you can import here. This toolbar is a local authoring tool, not a protected teacher account.</p><div class="editor-actions"><button id="apply" class="primary">Save browser draft</button><button id="export-site" class="secondary">Export website</button><button id="export" class="secondary">Export JSON backup</button><label class="secondary import-label">Import JSON<input type="file" id="import" accept=".json,application/json"></label><button id="restore" class="secondary">Restore published content</button></div><details class="builder" open><summary>Add a unit or lesson</summary><div class="builder-fields"><label>Level<select id="edit-level">${bank.sections.flatMap(s=>s.levels.map(l=>`<option value="${l.id}">${esc(l.title)}</option>`)).join('')}</select></label><label>Unit<select id="edit-unit"></select></label><label>Title<input id="item-title" placeholder="Enter your curriculum title"></label><button id="add-unit" class="secondary">Add unit</button><button id="add-lesson" class="secondary">Add lesson</button></div></details><details class="builder"><summary>Quiz authoring guide</summary><p>Edit quizzes inside a lesson’s <code>quizzes</code> array. Categories: vocabulary, grammar, review, challenge, remedial. Each quiz has id, title, category, questions. Each question has id, title, prompt, explanation, and type. For choice, add options and a zero-based answer index. For text, add an answers array. IDs must be globally unique. Remove an item by deleting its object. All changes are validated before saving or export.</p></details><label class="text-label" for="content-editor">Content bank · JSON editor</label><textarea id="content-editor" spellcheck="false" rows="20"></textarea><p id="editor-status" role="status" aria-live="polite"></p>`;const editor=$('#content-editor');editor.value=JSON.stringify(bank,null,2);const status=(msg,error=false)=>{$('#editor-status').textContent=msg;$('#editor-status').className=error?'error':'success';};const get=()=>validate(JSON.parse(editor.value));const units=()=>{try{const b=get(),l=b.sections.flatMap(s=>s.levels).find(x=>x.id===$('#edit-level').value);$('#edit-unit').innerHTML=l.units.map(u=>`<option value="${u.id}">${esc(u.title)}</option>`).join('')||'<option value="">Add a unit first</option>';}catch(e){status(e.message,true);}};units();$('#edit-level').onchange=units;$('#close-editor').onclick=()=>el.hidden=true;$('#apply').onclick=()=>{try{const b=get();if(save('draft',b)){bank=b;render();units();status('Browser draft saved. Export to publish for everyone.');}}catch(e){status(e.message,true);}};$('#export').onclick=()=>{try{const b=get(),url=URL.createObjectURL(new Blob([JSON.stringify(b,null,2)+'\n'],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='content.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Exported validated content. Replace data/content.json to publish.');}catch(e){status(e.message,true);}};$('#export-site').onclick=()=>{try{const b=get();const doc=document.documentElement.cloneNode(true);doc.querySelector('#published-bank').textContent=JSON.stringify(b,null,2).replace(/</g,'\\u003c');doc.querySelector('#teacher').innerHTML='';doc.querySelector('#teacher').hidden=true;doc.querySelector('#main').innerHTML='';const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Website exported. Upload index.html to your ALC repository to publish.');}catch(e){status(e.message,true);}};$('#import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>5000000)throw Error('Choose a file smaller than 5 MB.');const b=validate(JSON.parse(await file.text()));editor.value=JSON.stringify(b,null,2);units();status('Imported into editor. Save browser draft to preview.');}catch(e){status(e.message,true);}};$('#restore').onclick=()=>{if(confirm('Discard your browser draft and return to published content? Export first to keep your changes.')){bank=structuredClone(published);try{localStorage.removeItem(key+'draft');}catch{}editor.value=JSON.stringify(bank,null,2);render();units();status('Published content restored.');}};for(const type of ['unit','lesson'])$('#add-'+type).onclick=()=>{try{const b=get(),l=b.sections.flatMap(s=>s.levels).find(x=>x.id===$('#edit-level').value),title=$('#item-title').value.trim();if(!title)throw Error('Enter a title first.');const id=type+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);if(type==='unit')l.units.push({id,title,lessons:[]});else{const u=l.units.find(x=>x.id===$('#edit-unit').value);if(!u)throw Error('Add or select a unit first.');u.lessons.push({id,title,quizzes:[]});}validate(b);editor.value=JSON.stringify(b,null,2);units();$('#item-title').value='';status('Added to editor. Save browser draft to preview.');}catch(e){status(e.message,true);}};}
$('#teacher-toggle').onclick=teacher;window.addEventListener('hashchange',()=>{render();main.focus();window.scrollTo(0,0);});
try{published=validate(JSON.parse(document.getElementById("published-bank").textContent));bank=structuredClone(published);const draft=read('draft',null);if(draft){try{bank=validate(draft);}catch{}}render();}catch(e){main.innerHTML=empty('Unable to load your learning spaces','Please refresh or ask your teacher to check the content file.');console.error(e);}
