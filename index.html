<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALC English Challenge</title>
<style>
body{margin:0;background:#fbfaf6;color:#183d34;font:16px system-ui,sans-serif}
main{max-width:640px;margin:12vh auto;padding:36px}
h1{font-size:30px}p{line-height:1.7;color:#52665d}
button{padding:12px 20px;border:0;border-radius:7px;color:#fff;background:#174c3e;font:inherit;cursor:pointer}
small{display:block;margin-top:15px}
</style>
</head>
<body><main id="loading" role="status" aria-live="polite"><h1>ALC English Challenge</h1><p>Opening your learning space…</p></main>
<script>
(async function(){
  const source = "https://raw.githubusercontent.com/mouradelammari1/ALC-English-Challenge/4062b2cf2e5bd5915f8285680259bcca814f9b01/index.html";
  const addedLesson = {"id": "j6-u2-future-tenses", "title": "Future Tenses", "category": "grammar", "description": "Unit 2 · Page 28. Practise will, be going to, present progressive and simple present.", "quizzes": [{"id": "j6-u2-future-forms-consolidation", "title": "Future Tenses · Choose & Use", "category": "grammar", "source": "Unit 2 · Future tenses · Student's Book p. 28", "description": "20 contextual questions, instant feedback and a score.", "shuffleQuestions": false, "questions": [{"id": "j6-future-timetable", "title": "School timetable", "type": "choice", "prompt": "The timetable says the computer club starts at 4:00. Which sentence is best?", "options": ["The computer club starts at 4:00.", "The computer club will starting at 4:00.", "The computer club is start at 4:00.", "The computer club going to start at 4:00."], "answer": 0, "explanation": "Use the simple present for official timetables."}, {"id": "j6-future-arrangement", "title": "An arranged meeting", "type": "choice", "prompt": "You and your friend agreed to meet at 5 tomorrow. Which sentence emphasizes the arrangement?", "options": ["I meet my friend every day.", "I'm meeting my friend at 5 tomorrow.", "I'll meeting my friend tomorrow.", "I met my friend yesterday."], "answer": 1, "explanation": "Use the present progressive for a future arrangement."}, {"id": "j6-future-evidence", "title": "Visible evidence", "type": "choice", "prompt": "Look at those huge black clouds! What is the best prediction?", "options": ["It's raining yesterday.", "It rains last night.", "It's going to rain.", "It will to rain."], "answer": 2, "explanation": "Use be going to for predictions based on evidence now."}, {"id": "j6-future-offer", "title": "A spontaneous offer", "type": "choice", "prompt": "Your friend drops her books. You decide right now to help. What do you say?", "options": ["I helped you yesterday.", "I help you every day.", "I'm helping you last year.", "I'll pick them up for you."], "answer": 3, "explanation": "Use will for an offer or decision made while speaking."}, {"id": "j6-future-prediction", "title": "Prediction about 2050", "type": "choice", "prompt": "Which is a general prediction?", "options": ["I think robots will do more household chores by 2050.", "I'm meeting a teacher at 2.", "The museum opens at 9.", "I decided yesterday to buy a robot."], "answer": 0, "explanation": "Will is natural after I think, probably, or I'm sure."}, {"id": "j6-future-intention", "title": "A prior intention", "type": "choice", "prompt": "We decided yesterday to start a coding club. We ____ a club next term.", "options": ["start", "are going to start", "starts", "will starting"], "answer": 1, "explanation": "Be going to emphasizes a plan decided before speaking."}, {"id": "j6-future-dentist", "title": "An appointment", "type": "choice", "prompt": "I booked an appointment yesterday. I ____ the dentist at 3:30 tomorrow.", "options": ["see yesterday", "will seeing", "am seeing", "saw"], "answer": 2, "explanation": "An arranged appointment can use the present progressive."}, {"id": "j6-future-train", "title": "A scheduled departure", "type": "choice", "prompt": "According to the timetable, the train ____ at 7:15 tomorrow.", "options": ["is leaving yesterday", "will leaves", "leave", "leaves"], "answer": 3, "explanation": "Use the simple present for a published schedule."}, {"id": "j6-future-phone", "title": "Decision right now", "type": "choice", "prompt": "The phone is ringing. Nobody is answering. 'OK, I ____ it!'", "options": ["will answer", "answer last night", "am to answer", "answering"], "answer": 0, "explanation": "Use will + base verb for a spontaneous decision."}, {"id": "j6-future-hope", "title": "A future hope", "type": "choice", "prompt": "I hope scientists ____ new ways to treat serious illnesses.", "options": ["are discovering yesterday", "will discover", "discovering", "will discovered"], "answer": 1, "explanation": "Will is common after I hope for future expectations."}, {"id": "j6-future-negative-plan", "title": "Already decided not to", "type": "choice", "prompt": "My brother decided not to buy a new phone. He ____ one this year.", "options": ["won't buying", "doesn't buying", "isn't going to buy", "isn't buy"], "answer": 2, "explanation": "Use isn't going to + base verb for a prior decision."}, {"id": "j6-future-tickets", "title": "A booked family trip", "type": "choice", "prompt": "The tickets are booked. We ____ to Rabat on Saturday.", "options": ["travelled yesterday", "travels last weekend", "will travelling", "are travelling"], "answer": 3, "explanation": "The present progressive emphasizes a definite arrangement."}, {"id": "j6-future-will-form", "title": "After will", "type": "choice", "prompt": "Which sentence is grammatically correct?", "options": ["She will visit her cousins next week.", "She will to visit her cousins next week.", "She wills visiting her cousins next week.", "She will visits her cousins next week."], "answer": 0, "explanation": "Will takes the base form of the verb."}, {"id": "j6-future-question", "title": "Future arrangement question", "type": "choice", "prompt": "Which question correctly asks about arrangements tomorrow?", "options": ["Do you doing anything tomorrow?", "Are you doing anything tomorrow?", "Will you doing anything tomorrow?", "Are you do anything tomorrow?"], "answer": 1, "explanation": "Use are + subject + verb-ing."}, {"id": "j6-future-going-to-form", "title": "Going to structure", "type": "choice", "prompt": "Which sentence correctly expresses an intention?", "options": ["I'm going study robotics.", "I going to study robotics.", "I'm going to study robotics.", "I'm going to studying robotics."], "answer": 2, "explanation": "Use am/is/are + going to + base verb."}, {"id": "j6-future-negative-will", "title": "A negative prediction", "type": "choice", "prompt": "I'm sure robots ____ replace every human teacher.", "options": ["not will", "will doesn't", "won't to", "won't"], "answer": 3, "explanation": "The negative of will is won't or will not."}, {"id": "j6-future-schedule-word", "title": "Scheduled closing", "type": "text", "prompt": "According to its timetable, the science museum ____ (close) at 6 tomorrow. Type only the missing word.", "answers": ["closes"], "explanation": "Simple present: The museum closes at 6."}, {"id": "j6-future-offer-word", "title": "Offer to help", "type": "text", "prompt": "Your friend is carrying a heavy bag. 'I ____ (carry) that for you.' Type only the missing words.", "answers": ["will carry", "'ll carry", "’ll carry"], "explanation": "Spontaneous offer: I will carry that for you."}, {"id": "j6-future-arrangement-word", "title": "Arranged meeting", "type": "text", "prompt": "You and your cousins agreed on a time. 'We ____ (meet) at 4 tomorrow.' Type only the missing words.", "answers": ["are meeting", "'re meeting", "’re meeting"], "explanation": "Present progressive: We are meeting at 4 tomorrow."}, {"id": "j6-future-prediction-word", "title": "Prediction with evidence", "type": "text", "prompt": "Look at that glass near the edge! 'It ____ (fall) off the table!' Use going to. Type only the missing words.", "answers": ["is going to fall", "'s going to fall", "’s going to fall"], "explanation": "Going to: It is going to fall off the table."}]}]};
  const status = document.getElementById('loading');
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw Error('The original website could not be loaded ('+response.status+').');
    const original=await response.text();
    const re=/(<script type="application\/json" id="published-bank">)([\s\S]*?)(<\/script>)/;
    const match=original.match(re);
    if(!match) throw Error('The original content bank is missing.');
    const bank=JSON.parse(match[2]);
    const section=bank.sections.find(s=>s.id==='juniors');
    const level=section?.levels.find(l=>l.id==='juniors-6');
    const unit=level?.units.find(u=>u.id==='j6-unit-2');
    if(!unit)throw Error('Junior 6 Unit 2 was not found in the original course.');
    if(!unit.lessons.some(l=>l.id===addedLesson.id))unit.lessons.push(addedLesson);
    unit.description='Future tenses and expressions with get.';
    bank.revision='2026-11-20-junior6-future-forms';
    // The original Expressions with Get quiz and every other course remain unchanged.
    const safe=JSON.stringify(bank,null,2).replace(/</g,'\\u003c');
    const updated=original.replace(re,(_,a,b,c)=>a+safe+c);
    document.open();document.write(updated);document.close();
  }catch(err){
    console.error(err);
    status.innerHTML='<h1>Cannot open the course</h1><p id="error"></p><button id="retry">Try again</button><small>This page needs internet access to load the preserved original course.</small>';
    status.querySelector('#error').textContent=err.message;
    status.querySelector('#retry').onclick=()=>location.reload();
  }
})();
</script>
</body></html>
