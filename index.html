 main.innerHTML=crumbs([...r.c,[r.quiz.title]])+`<div class="quiz-panel ${r.quiz.readingCheck?'detective-panel':''}"><span class="eyebrow">${esc(q.round||categories[r.quiz.category])}</span><h1>${esc(r.quiz.title)}</h1><div class="question-meta"><span>${r.quiz.readingCheck?'Task':'Question'} ${r.index+1} of ${r.quiz.questions.length}</span><span>${r.answers.filter(Boolean).length} correct${r.streak>1?` · ${r.streak} in a row ✦`:r.practice?' · Targeted practice':''}</span></div><progress aria-label="Quiz progress" max="${r.quiz.questions.length}" value="${r.index}"></progress><form id="answer-form"><span class="task-label">${task}</span><h2>${esc(q.prompt)}</h2>${input}<button class="primary" type="submit">${q.type==='order'?'Lock timeline':'Check answer'}</button></form><div id="feedback" role="status" aria-live="polite"></div></div>`;
 if(q.type==='order'){
  const choices=q.items.map((_,i)=>i);for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
  const refresh=()=>{ $('#order-task').innerHTML=`<div class="order-picked" aria-label="Your timeline">${r.selected.length?r.selected.map((i,n)=>`<div><b>${n+1}</b><span>${esc(q.items[i])}</span></div>`).join(''):'<p>Your timeline starts here.</p>'}</div><div class="order-options">${choices.map(i=>`<button type="button" class="order-chip" id="event-${i}" ${r.selected.includes(i)?'disabled':''}><span>+</span>${esc(q.items[i])}</button>`).join('')}</div><button type="button" class="secondary" id="undo-order" ${r.selected.length?'':'disabled'}>↶ Undo last event</button>`;for(const i of choices)$('#event-'+i).onclick=()=>{if(r.checked||r.selected.includes(i))return;r.selected.push(i);refresh();$('#order-hint').textContent=`${r.selected.length} of ${q.items.length} events chosen.`;if(r.selected.length===q.items.length)$('#undo-order').focus();};$('#undo-order').onclick=()=>{if(r.checked)return;r.selected.pop();refresh();$('#order-hint').textContent=`${r.selected.length} of ${q.items.length} events chosen.`;};};refresh();
 }
 $('#answer-form').onsubmit=e=>{e.preventDefault();if(r.checked)return;if(q.type==='order'&&r.selected.length!==q.items.length){$('#order-hint').textContent='Choose every event before locking your timeline.';return;}const val=q.type==='order'?JSON.stringify(r.selected):new FormData(e.target).get('answer');if(val===null||!String(val).trim())return;r.checked=true;const correct=isCorrect(q,q.type==='choice'?Number(val):val);r.answers.push(correct);r.submitted.push(val);r.streak=correct?r.streak+1:0;e.target.querySelectorAll('input,button').forEach(x=>x.disabled=true);$('#feedback').innerHTML=`<div class="feedback ${correct?'correct':'incorrect'}"><h3>${correct?['Clue confirmed!','You’ve got it!','Nice detective work!'][r.index%3]:'A clue to revisit.'}</h3><p>${esc(q.explanation)}</p>${correct?'':`<p>Accepted answer: ${esc(answerLabel(q,null,true))}</p>`}</div><button id="next" class="primary">${r.index+1===r.quiz.questions.length?'Reveal my case report':'Next task →'}</button>`;$('#next').onclick=()=>{r.index++;r.checked=false;if(r.index<r.quiz.questions.length)showQuestion();else finish();window.scrollTo(0,0);main.focus();};$('#next').focus();};
}
function finish(){
 const r=run,result=score(r.answers),old=progress[r.quiz.id];
 if(!r.practice){progress[r.quiz.id]={title:r.quiz.title,best:Math.max(old?.best||0,result),last:result,firstScore:old?.firstScore??result,attempts:(old?.attempts||0)+1,route:r.route};save('progress',progress);}
 const record=progress[r.quiz.id];
 main.innerHTML=crumbs([...r.c,[r.quiz.title]])+`<div class="results"><span class="eyebrow">${r.practice?'TARGETED PRACTICE COMPLETE':r.quiz.readingCheck?'CASE REPORT':'PRACTICE COMPLETE'}</span><div class="result-score">${result}<small>%</small></div><h1>${r.quiz.readingCheck?'Case closed. Keep your evidence.':'Another step forward.'}</h1><p>${r.answers.filter(Boolean).length} of ${r.answers.length} correct · Best score: ${record?.best??result}%</p>${r.quiz.readingCheck?`<p class="first-score">First completed attempt: ${record?.firstScore??result}% · ${record?.attempts??1} full attempt(s)</p><p class="muted">Show this report to your teacher before replaying. Scores are stored on this device.</p>`:''}<button class="primary" id="replay">Try again ↻</button> ${link(r.c.at(-1)[1],r.quiz.readingCheck?'Back to reading':'Back to lesson','secondary')}${r.answers.some(a=>!a)?'<button class="secondary" id="retry-missed">Practise missed questions →</button>':''}<h2>Review your evidence</h2>${r.quiz.questions.map((q,i)=>`<div class="answer-review"><strong>${r.answers[i]?'✓':'○'} ${esc(q.prompt)}</strong><p>Your answer: ${esc(answerLabel(q,r.submitted[i]))}</p><p>Accepted answer: ${esc(answerLabel(q,null,true))}</p><p>${esc(q.explanation)}</p></div>`).join('')}</div>`;
 $('#replay').onclick=render;
 $('#retry-missed')?.addEventListener('click',()=>{const missed=r.quiz.questions.filter((_,i)=>!r.answers[i]);run={...r,quiz:prepareQuiz({...r.quiz,questions:missed}),index:0,answers:[],submitted:[],streak:0,checked:false,practice:true};showQuestion();window.scrollTo(0,0);main.focus();});
}
function teacher(){const el=$('#teacher');el.hidden=!el.hidden;if(el.hidden)return;el.innerHTML=`<div class="teacher-head"><div><span class="eyebrow">TEACHER WORKSPACE</span><h2>Shape the next lesson.</h2></div><button id="close-editor" class="secondary">Close ✕</button></div><p>Edits are drafts on this browser. Use Export website to download an updated index.html, then upload it to your separate GitHub repository to publish for students. JSON exports are backups you can import here. This toolbar is a local authoring tool, not a protected teacher account.</p><div class="editor-actions"><button id="apply" class="primary">Save browser draft</button><button id="export-site" class="secondary">Export website</button><button id="export" class="secondary">Export JSON backup</button><label class="secondary import-label">Import JSON<input type="file" id="import" accept=".json,application/json"></label><button id="load-draft" class="secondary">Load saved browser draft</button><button id="restore" class="secondary">Restore published content</button></div><details class="builder" open><summary>Add a unit or lesson</summary><div class="builder-fields"><label>Level<select id="edit-level">${bank.sections.flatMap(s=>s.levels.map(l=>`<option value="${l.id}">${esc(l.title)}</option>`)).join('')}</select></label><label>Unit<select id="edit-unit"></select></label><label>Title<input id="item-title" placeholder="Enter your curriculum title"></label><button id="add-unit" class="secondary">Add unit</button><button id="add-lesson" class="secondary">Add lesson</button></div></details><details class="builder"><summary>Quiz authoring guide</summary><p>Edit quizzes inside a lesson’s <code>quizzes</code> array. Categories: vocabulary, grammar, review, remedial. Each quiz has id, title, category, questions. Each question has id, title, prompt, explanation, and type. For choice, add options and a zero-based answer index. For text, add an answers array. For order, add an items array and an answer array of item indexes in correct sequence. IDs must be globally unique. Remove an item by deleting its object. All changes are validated before saving or export.</p></details><label class="text-label" for="content-editor">Content bank · JSON editor</label><textarea id="content-editor" spellcheck="false" rows="20"></textarea><p id="editor-status" role="status" aria-live="polite"></p>`;const editor=$('#content-editor');editor.value=JSON.stringify(bank,null,2);const status=(msg,error=false)=>{$('#editor-status').textContent=msg;$('#editor-status').className=error?'error':'success';};const get=()=>validate(JSON.parse(editor.value));const units=()=>{try{const b=get(),l=b.sections.flatMap(s=>s.levels).find(x=>x.id===$('#edit-level').value);$('#edit-unit').innerHTML=l.units.map(u=>`<option value="${u.id}">${esc(u.title)}</option>`).join('')||'<option value="">Add a unit first</option>';}catch(e){status(e.message,true);}};units();$('#edit-level').onchange=units;$('#close-editor').onclick=()=>el.hidden=true;$('#apply').onclick=()=>{try{const b=get();if(save('draft',b)){bank=b;render();units();status('Browser draft saved. Export to publish for everyone.');}}catch(e){status(e.message,true);}};$('#export').onclick=()=>{try{const b=get(),url=URL.createObjectURL(new Blob([JSON.stringify(b,null,2)+'\n'],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='content.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Exported validated content. Replace data/content.json to publish.');}catch(e){status(e.message,true);}};$('#export-site').onclick=()=>{try{const b=get();const doc=document.documentElement.cloneNode(true);doc.querySelector('#published-bank').textContent=JSON.stringify(b,null,2).replace(/</g,'\\u003c');doc.querySelector('#teacher').innerHTML='';doc.querySelector('#teacher').hidden=true;doc.querySelector('#main').innerHTML='';const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Website exported. Upload index.html to your ALC repository to publish.');}catch(e){status(e.message,true);}};$('#import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>5000000)throw Error('Choose a file smaller than 5 MB.');const b=validate(JSON.parse(await file.text()));editor.value=JSON.stringify(b,null,2);units();status('Imported into editor. Save browser draft to preview.');}catch(e){status(e.message,true);}};$('#load-draft').onclick=()=>{try{const d=read('draft',null);if(!d)throw Error('No saved browser draft.');validate(d);editor.value=JSON.stringify(d,null,2);units();status('Saved draft loaded into editor. Export a backup or save to preview.');}catch(e){status(e.message,true);}};$('#restore').onclick=()=>{if(confirm('Discard your browser draft and return to published content? Export first to keep your changes.')){bank=structuredClone(published);try{localStorage.removeItem(key+'draft');}catch{}editor.value=JSON.stringify(bank,null,2);render();units();status('Published content restored.');}};for(const type of ['unit','lesson'])$('#add-'+type).onclick=()=>{try{const b=get(),l=b.sections.flatMap(s=>s.levels).find(x=>x.id===$('#edit-level').value),title=$('#item-title').value.trim();if(!title)throw Error('Enter a title first.');const id=type+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);if(type==='unit')l.units.push({id,title,lessons:[]});else{const u=l.units.find(x=>x.id===$('#edit-unit').value);if(!u)throw Error('Add or select a unit first.');u.lessons.push({id,title,quizzes:[]});}validate(b);editor.value=JSON.stringify(b,null,2);units();$('#item-title').value='';status('Added to editor. Save browser draft to preview.');}catch(e){status(e.message,true);}};}
$('#teacher-toggle').onclick=teacher;window.addEventListener('hashchange',()=>{render();main.focus();window.scrollTo(0,0);});
try{published=validate(JSON.parse(document.getElementById("published-bank").textContent));bank=structuredClone(published);const draft=read('draft',null);if(draft){try{validate(draft);if(draft.revision===published.revision)bank=draft;else{const notice=document.createElement('div');notice.className='draft-notice';notice.textContent='New course content is available. Your older browser draft is kept in storage. Open Teacher workspace to export it or restore the published version.';document.querySelector('header').after(notice);}}catch{}}render();}catch(e){main.innerHTML=empty('Unable to load your learning spaces','Please refresh or ask your teacher to check the content file.');console.error(e);}</script></body></html>
